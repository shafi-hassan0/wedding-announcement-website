# Every request arrives from the cloudflared container, so $binary_remote_addr is
# the same for all visitors. Limit on the visitor address Cloudflare passes along.
limit_req_zone $http_cf_connecting_ip zone=wedding_api:10m rate=60r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # style-src/font-src allow Google Fonts (Cormorant Garamond, Jost, Pinyon Script).
    # The site has no inline scripts or inline styles, so nothing else is needed.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; form-action 'self'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Family-only site: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    location /api/ {
        limit_req zone=wedding_api burst=30 nodelay;
        proxy_pass http://wedding-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # cloudflared talks to nginx over plain http, so $scheme would always be
        # "http". Pass along what the visitor actually used, so cookies get Secure.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # The home page. "/" has to be named explicitly: the catch-all below looks for a
    # file called "/" or "/.html", finds neither, and would answer 404.
    location = / {
        expires -1;
        try_files /index.html =404;
    }

    location = /admin {
        expires -1;
        try_files /admin.html =404;
    }

    location /photos/ {
        expires 7d;
    }

    # Scripts and styles. The folder name is a fingerprint of their contents (see
    # scripts/build.js), so a given address never changes and can be kept for a long time.
    location /v/ {
        expires 30d;
    }

    location / {
        # Always revalidate pages, styles and scripts so an update shows up right away.
        expires -1;
        try_files $uri $uri.html =404;
    }

    # Keep in step with the headers in server/lib/static.js (used for local development).
}
