<section class="section" id="contact">
  <div class="container narrow">
    <header class="section-head">
      <p class="eyebrow">Questions?</p>
      <h2>They’d love to hear from you.</h2>
      <p class="section-intro">You can reach out to Shafi or Phoenix directly, or send them a message through this form.</p>
    </header>

    <div class="card form-card">
      <div id="contact-done" class="done" hidden tabindex="-1">
        <h3>Message sent!</h3>
        <p>Shafi and Phoenix will get back to you soon.</p>
      </div>
      <form id="contact-form" novalidate>
        <div class="field">
          <label for="contact-name">Your name</label>
          <input id="contact-name" name="name" type="text" autocomplete="name" maxlength="80" required>
        </div>
        <div class="field">
          <label for="contact-reply">Your phone or email <span class="soft">(so they can reply)</span></label>
          <input id="contact-reply" name="reply" type="text" maxlength="120" required>
        </div>
        <div class="field">
          <label for="contact-message">Your message</label>
          <textarea id="contact-message" name="message" rows="4" maxlength="2000" required></textarea>
        </div>
        <div class="hp" aria-hidden="true">
          <label for="contact-website">Leave this field empty</label>
          <input id="contact-website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>
        <p class="form-status" role="alert" hidden></p>
        <button type="submit" class="btn btn-wide">Send message</button>
      </form>
    </div>
  </div>
</section>
